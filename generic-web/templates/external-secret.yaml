{{- if .Values.platform.externalSecrets.enabled }}
{{- include "arkhadia-common.externalSecret.extract" (dict
  "ctx" .
  "name" (printf "%s-env" (include "generic-web.fullname" .))
  "targetName" (default (printf "%s-env" (include "generic-web.fullname" .)) .Values.platform.envFromSecret)
  "remoteKey" (required "platform.externalSecrets.remoteRef.key is required when externalSecrets.enabled" .Values.platform.externalSecrets.remoteRef.key)
) }}
{{- end }}
