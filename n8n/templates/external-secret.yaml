{{- if .Values.platform.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "n8n-platform.fullname" . }}-env
  labels:
    {{- include "n8n-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.platform.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.platform.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.platform.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "n8n-platform.fullname" . }}-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.platform.externalSecrets.env.remoteRef.key | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "n8n-platform.fullname" . }}-db
  labels:
    {{- include "n8n-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.platform.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.platform.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.platform.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "n8n-platform.fullname" . }}-postgres
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: "{{ `{{ .username }}` }}"
        POSTGRES_PASSWORD: "{{ `{{ .password }}` }}"
        POSTGRES_DB: "{{ `{{ .database }}` }}"
        DB_POSTGRESDB_USER: "{{ `{{ .username }}` }}"
        DB_POSTGRESDB_PASSWORD: "{{ `{{ .password }}` }}"
  dataFrom:
    - extract:
        key: {{ .Values.platform.externalSecrets.db.remoteRef.key | quote }}
{{- end }}
