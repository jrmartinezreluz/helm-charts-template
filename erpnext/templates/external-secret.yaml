{{- if .Values.platform.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-db-credentials
  labels:
    {{- include "erpnext-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.platform.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.platform.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.platform.externalSecrets.secretStoreRef.kind }}
  target:
    name: erpnext-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        db-host: "{{ `{{ .host }}` }}"
        db-name: "{{ `{{ .database }}` }}"
        db-username: "{{ `{{ .username }}` }}"
        db-password: "{{ `{{ .password }}` }}"
  dataFrom:
    - extract:
        key: {{ .Values.platform.externalSecrets.db.remoteRef.key | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-admin-credentials
  labels:
    {{- include "erpnext-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.platform.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.platform.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.platform.externalSecrets.secretStoreRef.kind }}
  target:
    name: erpnext-admin-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.platform.externalSecrets.admin.remoteRef.key | quote }}
{{- end }}
