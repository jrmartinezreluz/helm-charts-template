{{- if .Values.platform.externalSecrets.enabled }}
# Upstream ERPNext chart expects release-scoped secret "{{ .Release.Name }}" / db-root-password.
# Site bootstrap uses RDS master credentials (not the per-env app user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-helm-db-root
  labels:
    {{- include "erpnext-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.platform.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.platform.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.platform.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Release.Name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        db-root-username: "{{ `{{ .username }}` }}"
        db-root-password: "{{ `{{ .password }}` }}"
  dataFrom:
    - extract:
        key: {{ .Values.platform.externalSecrets.rdsMaster.remoteRef.key | quote }}
{{- end }}
